[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "localwiki"
version = "0.1.0"
description = "Fully local Karpathy-style self-compiling wiki powered by Ollama"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "ollama>=0.3",
    "numpy>=1.26",
    "tavily-python>=0.3",
    "pypdf>=4.0",
    "pypdfium2>=4.0",
    "pillow>=10.0",
    "python-docx>=1.1",
    "python-frontmatter>=1.1",
    "python-dotenv>=1.0",
    "streamlit>=1.35",
    "pyvis>=0.3",
    "langgraph>=0.2",
    "langchain-ollama>=0.2",
    "langchain-core>=0.3",
    # Deep Research (web mode) — the four imports the vendored open_deep_research
    # modules need beyond the above. See src/vendor/README.md for why the upstream
    # package is vendored rather than depended on.
    "langchain>=0.3",
    "aiohttp>=3.9",
    "langchain-mcp-adapters>=0.1.6",
    # <2 required: mcp 2.x dropped mcp.shared.context.RequestContext, which
    # langchain-mcp-adapters imports at module load.
    "mcp>=1.9.4,<2",
    "httpx>=0.27",
    "markdownify>=0.13",
    "bcrypt>=4.0",
    "networkx>=3.6.1",
    "scipy>=1.17.1",
]

[project.optional-dependencies]
# Stage D cross-encoder reranker. Optional on purpose: retrieval degrades to plain
# RRF fusion without it (src/rerank.py). NOTE: the prebuilt CPU "linux_x86_64" wheels on
# abetlen.github.io are musl-linked and fail to import on glibc — build from sdist (needs cmake).
rerank = ["llama-cpp-python>=0.3.19"]
# GPU reranker (optional, ~30× faster on NVIDIA; measured 353→11 ms/pair on 2×RTX 4090).
# Userspace CUDA — NO system toolkit, NO sudo. Install the CUDA runtime as pip wheels (below,
# pinned here) AND replace llama-cpp-python with a CUDA build from the abetlen index:
#   uv pip install --force-reinstall --no-cache-dir llama-cpp-python \
#       --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cu125
# rerank._preload_cuda() loads these .so's with RTLD_GLOBAL so libcudart resolves without
# LD_LIBRARY_PATH. CAVEAT: `uv sync --extra rerank` reverts to the CPU sdist build — re-run
# the CUDA llama-cpp-python install afterwards. (The abetlen CUDA wheels ARE glibc-compatible.)
rerank-cuda = ["nvidia-cuda-runtime-cu12", "nvidia-cublas-cu12", "nvidia-cuda-nvrtc-cu12"]

[dependency-groups]
dev = [
    "pre-commit>=4.6",
    "pyright[nodejs]>=1.1.414",
    "pytest>=9.0",
    "pytest-cov>=7.1",
    "pytest-timeout>=2.4",
    "ruff>=0.16",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]

# --- Quality gate numbers live here (see AGENTS.md §5.4) ---
# src/vendor/ is vendored third-party source (never hand-edited), so every tool skips it.

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["src/vendor"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "C90", "PT", "RUF"]
# Deliberate typography in prose, UI text and LLM prompts (en dash, multiplication and minus sign).
allowed-confusables = ["–", "×", "−"]

[tool.ruff.lint.per-file-ignores]
# Prompt strings are model input: re-wrapping a long line changes the text the LLM sees.
"src/prompts.py" = ["E501"]
# Import order is the point: app.py loads .env before modules read env vars at import
# (theme.FRONTEND, graph_widget.RENDERER); conftest disables it before any src import.
"src/app.py" = ["E402"]
"tests/conftest.py" = ["E402"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["src/vendor", "**/__pycache__"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = ["-ra", "--strict-markers", "--strict-config"]
xfail_strict = true
session_timeout = 60

[tool.coverage.run]
branch = true
source = ["src"]
omit = ["src/vendor/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true
exclude_also = ['if __name__ == "__main__":']
