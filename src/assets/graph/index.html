<!DOCTYPE html>
<!--
  Neural-galaxy renderer for the LocalWiki typed graph.

  Served as a static Streamlit component directory (src/graph_widget.py), so it
  is same-origin, needs no build step and pulls nothing from a CDN — fonts are
  the system stack on purpose (the app is local-first).

  It renders ONLY what Python computed: PageRank, betweenness, Louvain
  communities, staleness and orphan flags all arrive in the payload. Nothing
  here re-derives graph structure.

  Communication is the Streamlit component protocol over postMessage — that is
  what makes a node click land in st.session_state without reloading the page
  (a reload would drop the login session; see docs/ui.md).
-->
<meta charset="utf-8" />
<title>Wiki graph</title>
<style>
  :root {
    --bg: #05060d;
    --panel: rgba(12, 16, 30, 0.82);
    --ink: #e8ecff;
    --muted: #8b93b0;
    --line: rgba(140, 155, 200, 0.22);
    --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  #stage { position: relative; width: 100%; height: 100vh; }
  canvas { display: block; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(8px);
  }
  #search-box { top: 12px; left: 12px; padding: 6px; }
  #search {
    width: 200px; background: transparent; border: 0; outline: 0;
    color: var(--ink); font: inherit; padding: 3px 6px;
  }
  #search::placeholder { color: var(--muted); }

  #legend { bottom: 12px; left: 12px; max-width: 240px; }
  #legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #legend .meta { color: var(--muted); margin-top: 7px; font-size: 11px; }

  #info { top: 12px; right: 12px; width: 250px; display: none; }
  #info h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  #info .kv { display: flex; justify-content: space-between; gap: 10px;
              color: var(--muted); font-size: 11px; margin: 2px 0; }
  #info .kv b { color: var(--ink); font-weight: 500; }
  #info .hint { margin-top: 9px; color: var(--accent); font-size: 11px; }
  #info .tags { margin-top: 7px; color: var(--muted); font-size: 11px; }

  #empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; color: var(--muted);
  }
  @media (max-width: 720px) { #legend, #info { display: none !important; } }
</style>

<div id="stage">
  <canvas id="cv"></canvas>
  <div class="panel" id="search-box"><input id="search" autocomplete="off" /></div>
  <div class="panel" id="legend"></div>
  <div class="panel" id="info"></div>
  <div id="empty"></div>
</div>

<script>
"use strict";

// --- Streamlit component protocol -----------------------------------------
// Hand-rolled instead of the npm `streamlit-component-lib`: the protocol is
// four postMessage shapes, and depending on it would drag a Node build step
// into a uv-only, build-free project.
function post(msg) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
}
const Streamlit = {
  ready: () => post({ type: "streamlit:componentReady", apiVersion: 1 }),
  setFrameHeight: (h) => post({ type: "streamlit:setFrameHeight", height: h }),
  setValue: (value) => post({ type: "streamlit:setComponentValue", value, dataType: "json" }),
};

const CAT_COLOR = {
  concept: "#38d9a9",
  entity: "#4a9eff",
  "source-summary": "#ffd43b",
  report: "#9775fa",
  insight: "#f783ac",
  source: "#ff922b",
};
const ORPHAN_COLOR = "#6b7280";
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const infoEl = document.getElementById("info");
const legendEl = document.getElementById("legend");
const searchEl = document.getElementById("search");
const emptyEl = document.getElementById("empty");

let S = {                    // everything that survives a Streamlit rerun
  sig: null,                 // payload signature; changes => rebuild layout
  nodes: [], edges: [], adj: new Map(),
  mode: "galaxy", overlays: [], strings: {}, accent: "#4a9eff",
  view: { x: 0, y: 0, k: 1 },
  hover: null, selected: null, query: "", clicks: 0,
  alpha: 1, t: 0,
};

// --- payload -> simulation state -------------------------------------------
function ingest(payload) {
  const maxPr = Math.max(...payload.nodes.map((n) => n.pr), 1e-9);
  const groups = new Map();
  S.nodes = payload.nodes.map((n) => {
    // Community-seeded start positions: the layout converges faster and the
    // map keeps a recognisable shape between runs.
    if (!groups.has(n.comm)) groups.set(n.comm, groups.size);
    return Object.assign({}, n, {
      x: 0, y: 0, vx: 0, vy: 0,
      r: 3.5 + 9 * Math.sqrt(n.pr / maxPr) + Math.min(n.deg, 12) * 0.25,
      phase: Math.random() * Math.PI * 2,
    });
  });
  const total = Math.max(groups.size, 1);
  const byId = new Map(S.nodes.map((n) => [n.id, n]));
  S.nodes.forEach((n) => {
    const a = (groups.get(n.comm) / total) * Math.PI * 2;
    const spread = 60 + 180 * Math.random();
    n.x = Math.cos(a) * 260 + (Math.random() - 0.5) * spread;
    n.y = Math.sin(a) * 260 + (Math.random() - 0.5) * spread;
  });

  S.edges = payload.edges
    .map((e) => ({ s: byId.get(e.s), t: byId.get(e.t), type: e.type, pulse: Math.random() }))
    .filter((e) => e.s && e.t);

  S.adj = new Map(S.nodes.map((n) => [n.id, new Set()]));
  S.edges.forEach((e) => {
    S.adj.get(e.s.id).add(e.t.id);
    S.adj.get(e.t.id).add(e.s.id);
  });

  S.alpha = 1;
  S.view = { x: 0, y: 0, k: 1 };
  emptyEl.style.display = S.nodes.length ? "none" : "flex";
}

// --- force layout ----------------------------------------------------------
// Grid-bucketed repulsion: full O(n²) stalls well before GRAPH_MAX_NODES, and a
// uniform grid is enough here because the graph is sparse and clustered.
const CELL = 120;
function tick() {
  if (S.alpha < 0.005) return;
  const grid = new Map();
  const key = (x, y) => `${Math.round(x / CELL)}:${Math.round(y / CELL)}`;
  S.nodes.forEach((n) => {
    const k = key(n.x, n.y);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(n);
  });

  S.nodes.forEach((n) => {
    const cx = Math.round(n.x / CELL), cy = Math.round(n.y / CELL);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const bucket = grid.get(`${cx + dx}:${cy + dy}`);
        if (!bucket) continue;
        bucket.forEach((m) => {
          if (m === n) return;
          let ddx = n.x - m.x, ddy = n.y - m.y;
          let d2 = ddx * ddx + ddy * ddy;
          if (d2 < 1) { ddx = Math.random() - 0.5; ddy = Math.random() - 0.5; d2 = 1; }
          if (d2 > CELL * CELL) return;
          const f = (900 * (n.r + m.r)) / (d2 * Math.sqrt(d2));
          n.vx += ddx * f; n.vy += ddy * f;
        });
      }
    }
    // Gravity toward the origin keeps detached components on screen.
    n.vx -= n.x * 0.0016;
    n.vy -= n.y * 0.0016;
  });

  S.edges.forEach((e) => {
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const rest = e.type === "derived-from" ? 95 : 70;
    const f = ((d - rest) / d) * 0.012;
    e.s.vx += dx * f; e.s.vy += dy * f;
    e.t.vx -= dx * f; e.t.vy -= dy * f;
  });

  S.nodes.forEach((n) => {
    n.x += (n.vx *= 0.82) * S.alpha;
    n.y += (n.vy *= 0.82) * S.alpha;
  });
  S.alpha *= 0.985;
}

// --- drawing ---------------------------------------------------------------
function nodeColor(n) {
  if (n.orphan && S.overlays.includes("orphans")) return ORPHAN_COLOR;
  return CAT_COLOR[n.cat] || ORPHAN_COLOR;
}

function focusSet() {
  // Hover lights up the node's 2-hop neighbourhood — the "what is this
  // connected to, and to what through that" question a node-link diagram
  // usually forces you to trace by eye.
  const anchor = S.hover || S.selected;
  if (!anchor) return null;
  const set = new Set([anchor]);
  (S.adj.get(anchor) || []).forEach((a) => {
    set.add(a);
    (S.adj.get(a) || []).forEach((b) => set.add(b));
  });
  return set;
}

function matches(n) {
  return S.query && n.label.toLowerCase().includes(S.query);
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== w * dpr || cv.height !== h * dpr) {
    cv.width = w * dpr; cv.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = "#05060d";
  ctx.fillRect(0, 0, w, h);

  ctx.save();
  ctx.translate(w / 2 + S.view.x, h / 2 + S.view.y);
  ctx.scale(S.view.k, S.view.k);

  const focus = focusSet();
  const neural = S.mode === "neural";
  const drift = neural && !REDUCED_MOTION ? 2.2 : 0;
  const px = (n) => n.x + (drift ? Math.cos(S.t * 0.012 + n.phase) * drift : 0);
  const py = (n) => n.y + (drift ? Math.sin(S.t * 0.014 + n.phase) * drift : 0);

  // Edges
  S.edges.forEach((e) => {
    const lit = !focus || (focus.has(e.s.id) && focus.has(e.t.id));
    const x1 = px(e.s), y1 = py(e.s), x2 = px(e.t), y2 = py(e.t);
    ctx.globalAlpha = lit ? (neural ? 0.5 : 0.32) : 0.05;
    ctx.strokeStyle = e.type === "derived-from" ? "#ff922b" : (neural ? S.accent : "#7f8bb5");
    ctx.lineWidth = (e.type === "derived-from" ? 0.5 : 0.9) / S.view.k;
    if (e.type === "derived-from") ctx.setLineDash([3 / S.view.k, 3 / S.view.k]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Synapse pulse: neural mode only, and never under reduced motion.
    if (neural && lit && !REDUCED_MOTION) {
      const p = (e.pulse + S.t * 0.004) % 1;
      ctx.globalAlpha = 0.75 * (1 - Math.abs(p * 2 - 1));
      ctx.fillStyle = S.accent;
      ctx.beginPath();
      ctx.arc(x1 + (x2 - x1) * p, y1 + (y2 - y1) * p, 1.4 / S.view.k, 0, 7);
      ctx.fill();
    }
  });

  // Nodes
  const showHubs = S.overlays.includes("hubs");
  const showBridges = S.overlays.includes("bridges");
  const showStale = S.overlays.includes("stale");
  const showLowConf = S.overlays.includes("confidence");

  S.nodes.forEach((n) => {
    const lit = !focus || focus.has(n.id);
    const hit = matches(n);
    const x = px(n), y = py(n);
    const color = nodeColor(n);
    let alpha = lit ? 1 : 0.12;
    if (S.query && !hit) alpha *= 0.25;
    if (showLowConf && n.confidence === "low") alpha *= 0.55;

    // Glow: hubs bloom, everything else gets a soft halo in galaxy mode.
    const glow = (showHubs && n.hub ? 3.4 : 1) * (hit ? 3 : 1);
    if (glow > 1 || !neural) {
      const g = ctx.createRadialGradient(x, y, 0, x, y, n.r * 3.2 * glow);
      g.addColorStop(0, color);
      g.addColorStop(1, "rgba(0,0,0,0)");
      ctx.globalAlpha = alpha * 0.28;
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, n.r * 3.2 * glow, 0, 7);
      ctx.fill();
    }

    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, n.r, 0, 7);
    ctx.fill();

    if (showBridges && n.bridgeHub) {
      ctx.globalAlpha = alpha * 0.9;
      ctx.strokeStyle = "#e8ecff";
      ctx.lineWidth = 1.2 / S.view.k;
      ctx.beginPath();
      ctx.arc(x, y, n.r + 3.5, 0, 7);
      ctx.stroke();
    }
    if (showStale && n.stale) {
      const beat = REDUCED_MOTION ? 0.8 : 0.5 + 0.5 * Math.sin(S.t * 0.05 + n.phase);
      ctx.globalAlpha = alpha * beat;
      ctx.strokeStyle = "#ffa421";
      ctx.lineWidth = 1.6 / S.view.k;
      ctx.beginPath();
      ctx.arc(x, y, n.r + 6, 0, 7);
      ctx.stroke();
    }
    if (n.id === S.selected) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8 / S.view.k;
      ctx.beginPath();
      ctx.arc(x, y, n.r + 5, 0, 7);
      ctx.stroke();
    }

    // Labels stay readable rather than complete: hubs and whatever is in
    // focus / matched, and only once zoomed enough to have room.
    const named = hit || n.id === S.hover || n.id === S.selected ||
                  (lit && (n.hub || S.view.k > 1.5) && n.r > 5);
    if (named && lit) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#e8ecff";
      ctx.font = `${Math.max(9, 11 / S.view.k)}px -apple-system, "Segoe UI", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(n.label.slice(0, 38), x, y - n.r - 5 / S.view.k);
    }
  });

  ctx.restore();
  ctx.globalAlpha = 1;
}

function frame() {
  S.t++;
  tick();
  draw();
  requestAnimationFrame(frame);
}

// --- interaction -----------------------------------------------------------
function toWorld(ev) {
  const rect = cv.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left - rect.width / 2 - S.view.x) / S.view.k,
    y: (ev.clientY - rect.top - rect.height / 2 - S.view.y) / S.view.k,
  };
}

function nodeAt(ev) {
  const p = toWorld(ev);
  let best = null, bestD = Infinity;
  S.nodes.forEach((n) => {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < Math.max(n.r + 6, 10) && d < bestD) { best = n; bestD = d; }
  });
  return best;
}

let dragging = false, moved = false, last = null;

cv.addEventListener("mousedown", (e) => {
  dragging = true; moved = false; last = { x: e.clientX, y: e.clientY };
  cv.classList.add("dragging");
});
window.addEventListener("mouseup", () => { dragging = false; cv.classList.remove("dragging"); });
cv.addEventListener("mousemove", (e) => {
  if (dragging) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    S.view.x += dx;
    S.view.y += dy;
    // A few pixels of jitter while clicking must not be read as a pan, or the
    // click would be swallowed and the node never open.
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    last = { x: e.clientX, y: e.clientY };
    return;
  }
  const n = nodeAt(e);
  S.hover = n ? n.id : null;
  cv.style.cursor = n ? "pointer" : "grab";
});
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const k = Math.min(4, Math.max(0.25, S.view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  S.view.k = k;
}, { passive: false });

cv.addEventListener("click", (e) => {
  if (moved) return;
  const n = nodeAt(e);
  if (!n) { S.selected = null; infoEl.style.display = "none"; return; }
  S.selected = n.id;
  showInfo(n);
  // The navigation contract: hand the id to Python, which selects the page in
  // the existing reader. Deliberately NOT a window.top navigation — that is a
  // full page load and would drop the Streamlit session (login + active DB).
  Streamlit.setValue({ node: n.id, kind: n.kind, n: ++S.clicks });
});

searchEl.addEventListener("input", () => { S.query = searchEl.value.trim().toLowerCase(); });

// --- panels ----------------------------------------------------------------
function showInfo(n) {
  const t = S.strings;
  const rows = [
    [t.type, n.cat],
    [t.links, String(n.deg)],
    [t.pagerank, n.pr.toFixed(4)],
    [t.bridge, n.bridge.toFixed(4)],
    [t.community, String(n.comm)],
  ];
  if (n.confidence) rows.push([t.confidence, n.confidence]);
  if (n.updated) rows.push([t.updated, n.updated + (n.stale ? " ⚠️" : "")]);
  infoEl.innerHTML =
    `<h2>${esc(n.label)}</h2>` +
    rows.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("") +
    (n.tags.length ? `<div class="tags">${n.tags.map(esc).join(" · ")}</div>` : "") +
    `<div class="hint">${esc(n.kind === "page" ? t.opened : t.sourceNode)}</div>`;
  infoEl.style.display = "block";
}

function renderLegend(payload) {
  const t = S.strings;
  const cats = [...new Set(payload.nodes.map((n) => n.cat))].sort();
  legendEl.innerHTML =
    cats.map((c) =>
      `<div class="row"><span class="dot" style="background:${CAT_COLOR[c] || ORPHAN_COLOR}"></span>${esc(c)}</div>`
    ).join("") +
    `<div class="meta">${payload.nodes.length} ${esc(t.nodes)} · ` +
    `${payload.edges.length} ${esc(t.edges)} · ` +
    `${payload.communities} ${esc(t.clusters)}` +
    (payload.truncated ? ` · ${esc(t.truncated)}` : "") + `</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// --- render loop from Streamlit --------------------------------------------
function onRender(args) {
  const payload = args.graph;
  S.mode = args.mode || "galaxy";
  S.overlays = args.overlays || [];
  S.strings = args.strings || {};
  S.accent = args.accent || "#4a9eff";
  document.documentElement.style.setProperty("--accent", S.accent);
  searchEl.placeholder = S.strings.search || "Search…";
  emptyEl.textContent = S.strings.empty || "";

  // Only rebuild the layout when the bundle actually changed; a rerun caused by
  // a click or an overlay toggle must not scatter the map the user is reading.
  const sig = payload.generated_at + "|" + payload.nodes.length + "|" + payload.edges.length;
  if (sig !== S.sig) {
    S.sig = sig;
    ingest(payload);
    renderLegend(payload);
  }
  if (args.selected && args.selected !== S.selected) {
    S.selected = args.selected;
    const n = S.nodes.find((x) => x.id === args.selected);
    if (n) showInfo(n);
  }
  Streamlit.setFrameHeight(args.height || 720);
}

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args || {});
});

Streamlit.ready();
Streamlit.setFrameHeight(720);
requestAnimationFrame(frame);
</script>
