<!DOCTYPE html>
<!--
  Neural renderer for the LocalWiki typed graph.

  Served as a static Streamlit component directory (src/graph_widget.py), so it
  is same-origin, needs no build step and pulls nothing from a CDN — fonts are
  the system stack and galaxy.jpg ships in this directory, on purpose (the app
  is local-first). Backdrop credit: NASA/ESA Hubble — see NOTICE.

  It renders ONLY what Python computed: PageRank, betweenness, Louvain
  communities, staleness and orphan flags all arrive in the payload. Nothing
  here re-derives graph structure.

  Communication is the Streamlit component protocol over postMessage — that is
  what makes a node click land in st.session_state without reloading the page
  (a reload would drop the login session; see docs/ui.md).
-->
<meta charset="utf-8" />
<title>Wiki graph</title>
<style>
  :root {
    --bg: #05060d;
    --panel: rgba(12, 16, 30, 0.82);
    --ink: #e8ecff;
    --muted: #8b93b0;
    --line: rgba(140, 155, 200, 0.22);
    --accent: #4a9eff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); }
  body {
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
    color: var(--ink);
  }
  #stage { position: relative; width: 100%; height: 100vh; }

  /* Galaxy backdrop. Served from the component directory, so it is same-origin
     and needs no CDN. Dimmed hard: it is scenery behind the data, and the dots
     must stay the brightest thing on screen. `inset` overscan leaves room for
     the parallax shift without exposing an edge. */
  #sky {
    position: absolute; inset: -10%;
    background: url("galaxy.jpg") center / cover no-repeat;
    filter: brightness(0.42) saturate(0.85);
    will-change: transform;
  }
  #veil {
    position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(ellipse at center,
                rgba(5, 6, 13, 0.30) 0%, rgba(5, 6, 13, 0.72) 62%, rgba(5, 6, 13, 0.92) 100%);
  }
  canvas { display: block; position: relative; width: 100%; height: 100%; cursor: grab; }
  canvas.dragging { cursor: grabbing; }

  .panel {
    position: absolute;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
    backdrop-filter: blur(8px);
  }
  #search-box { top: 12px; left: 12px; padding: 6px; }
  #search {
    width: 200px; background: transparent; border: 0; outline: 0;
    color: var(--ink); font: inherit; padding: 3px 6px;
  }
  #search::placeholder { color: var(--muted); }

  #legend { bottom: 12px; left: 12px; max-width: 240px; }
  #legend .row { display: flex; align-items: center; gap: 7px; margin: 3px 0; }
  #legend .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  #legend .meta { color: var(--muted); margin-top: 7px; font-size: 11px; }

  #info { top: 12px; right: 12px; width: 250px; display: none; }
  #info h2 { margin: 0 0 6px; font-size: 14px; font-weight: 600; }
  #info .kv { display: flex; justify-content: space-between; gap: 10px;
              color: var(--muted); font-size: 11px; margin: 2px 0; }
  #info .kv b { color: var(--ink); font-weight: 500; }
  #info .hint { margin-top: 9px; color: var(--accent); font-size: 11px; }
  #info .tags { margin-top: 7px; color: var(--muted); font-size: 11px; }

  /* Ranked-circle chart (PageRank / Connections modes): the metric read as an
     ordered list, which a force layout alone cannot show. */
  #rank {
    bottom: 12px; right: 12px; width: 268px; display: none;
    max-height: 62%; overflow-y: auto; padding: 10px 6px 10px 10px;
  }
  #rank h3 { margin: 0 0 1px; font-size: 12px; font-weight: 600; }
  #rank .scope { color: var(--muted); font-size: 11px; margin-bottom: 8px; }
  #rank .r {
    display: flex; align-items: center; gap: 8px;
    padding: 2px 0; border-top: 1px dashed rgba(140, 155, 200, 0.16);
    cursor: pointer;
  }
  #rank .r:first-of-type { border-top: 0; }
  #rank .r:hover .name { color: #fff; }
  #rank .n { width: 17px; text-align: right; font-weight: 700; font-size: 11px; flex: none; }
  #rank .c { width: 46px; display: flex; justify-content: center; flex: none; }
  #rank .c span { border-radius: 50%; display: block; }
  #rank .name { flex: 1; font-size: 11px; overflow: hidden;
                text-overflow: ellipsis; white-space: nowrap; }
  #rank .v { color: var(--muted); font-size: 10px; flex: none; }

  #empty {
    position: absolute; inset: 0; display: none;
    align-items: center; justify-content: center; color: var(--muted);
  }
  @media (max-width: 720px) { #legend, #info, #rank { display: none !important; } }
</style>

<div id="stage">
  <div id="sky"></div>
  <div id="veil"></div>
  <canvas id="cv"></canvas>
  <div class="panel" id="search-box"><input id="search" autocomplete="off" /></div>
  <div class="panel" id="legend"></div>
  <div class="panel" id="info"></div>
  <div class="panel" id="rank"></div>
  <div id="empty"></div>
</div>

<script>
"use strict";

// --- Streamlit component protocol -----------------------------------------
// Hand-rolled instead of the npm `streamlit-component-lib`: the protocol is
// four postMessage shapes, and depending on it would drag a Node build step
// into a uv-only, build-free project.
function post(msg) {
  window.parent.postMessage(Object.assign({ isStreamlitMessage: true }, msg), "*");
}
const Streamlit = {
  ready: () => post({ type: "streamlit:componentReady", apiVersion: 1 }),
  setFrameHeight: (h) => post({ type: "streamlit:setFrameHeight", height: h }),
  setValue: (value) => post({ type: "streamlit:setComponentValue", value, dataType: "json" }),
};

const CAT_COLOR = {
  concept: "#38d9a9",
  entity: "#4a9eff",
  "source-summary": "#ffd43b",
  report: "#9775fa",
  insight: "#f783ac",
  source: "#ff922b",
};
const ORPHAN_COLOR = "#6b7280";
const REDUCED_MOTION = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const infoEl = document.getElementById("info");
const legendEl = document.getElementById("legend");
const searchEl = document.getElementById("search");
const emptyEl = document.getElementById("empty");

let S = {                    // everything that survives a Streamlit rerun
  sig: null,                 // payload signature; changes => rebuild layout
  nodes: [], edges: [], adj: new Map(),
  overlays: [], strings: {}, accent: "#4a9eff", sizeBy: "pagerank",
  rankColors: null,          // id -> rank colour, set while a selection is live
  maxPr: 1e-9, maxDeg: 1,
  view: { x: 0, y: 0, k: 1 },
  hover: null, selected: null, query: "", clicks: 0,
  alpha: 1, t: 0,
};

// --- node radius -----------------------------------------------------------
// One metric at a time — PageRank (default) or connections — so a dot's size
// means exactly one thing. Sizing never touches positions: switching metric
// re-radiuses in place, the layout stays put.
function radiusOf(n) {
  if (S.sizeBy === "degree") return 3 + 15 * Math.sqrt(n.deg / S.maxDeg);
  return 3 + 15 * Math.sqrt(n.pr / S.maxPr);
}

function applySizes() {
  S.nodes.forEach((n) => { n.r = radiusOf(n); });
}

// --- payload -> simulation state -------------------------------------------
function ingest(payload) {
  S.maxPr = Math.max(...payload.nodes.map((n) => n.pr), 1e-9);
  S.maxDeg = Math.max(...payload.nodes.map((n) => n.deg), 1);
  const groups = new Map();
  S.nodes = payload.nodes.map((n) => {
    // Community-seeded start positions: the layout converges faster and the
    // map keeps a recognisable shape between runs.
    if (!groups.has(n.comm)) groups.set(n.comm, groups.size);
    return Object.assign({}, n, {
      x: 0, y: 0, vx: 0, vy: 0,
      r: radiusOf(n),
      phase: Math.random() * Math.PI * 2,
    });
  });
  const total = Math.max(groups.size, 1);
  const byId = new Map(S.nodes.map((n) => [n.id, n]));
  S.nodes.forEach((n) => {
    const a = (groups.get(n.comm) / total) * Math.PI * 2;
    const spread = 60 + 180 * Math.random();
    n.x = Math.cos(a) * 260 + (Math.random() - 0.5) * spread;
    n.y = Math.sin(a) * 260 + (Math.random() - 0.5) * spread;
  });

  S.edges = payload.edges
    .map((e) => ({ s: byId.get(e.s), t: byId.get(e.t), type: e.type, pulse: Math.random() }))
    .filter((e) => e.s && e.t);

  S.adj = new Map(S.nodes.map((n) => [n.id, new Set()]));
  S.edges.forEach((e) => {
    S.adj.get(e.s.id).add(e.t.id);
    S.adj.get(e.t.id).add(e.s.id);
  });

  S.alpha = 1;
  S.view = { x: 0, y: 0, k: 1 };
  emptyEl.style.display = S.nodes.length ? "none" : "flex";
}

// --- force layout ----------------------------------------------------------
// Grid-bucketed repulsion: full O(n²) stalls well before GRAPH_MAX_NODES, and a
// uniform grid is enough here because the graph is sparse and clustered.
const CELL = 120;
function tick() {
  if (S.alpha < 0.005) return;
  const grid = new Map();
  const key = (x, y) => `${Math.round(x / CELL)}:${Math.round(y / CELL)}`;
  S.nodes.forEach((n) => {
    const k = key(n.x, n.y);
    if (!grid.has(k)) grid.set(k, []);
    grid.get(k).push(n);
  });

  S.nodes.forEach((n) => {
    const cx = Math.round(n.x / CELL), cy = Math.round(n.y / CELL);
    for (let dx = -1; dx <= 1; dx++) {
      for (let dy = -1; dy <= 1; dy++) {
        const bucket = grid.get(`${cx + dx}:${cy + dy}`);
        if (!bucket) continue;
        bucket.forEach((m) => {
          if (m === n) return;
          let ddx = n.x - m.x, ddy = n.y - m.y;
          let d2 = ddx * ddx + ddy * ddy;
          if (d2 < 1) { ddx = Math.random() - 0.5; ddy = Math.random() - 0.5; d2 = 1; }
          if (d2 > CELL * CELL) return;
          const f = (900 * (n.r + m.r)) / (d2 * Math.sqrt(d2));
          n.vx += ddx * f; n.vy += ddy * f;
        });
      }
    }
    // Gravity toward the origin keeps detached components on screen.
    n.vx -= n.x * 0.0016;
    n.vy -= n.y * 0.0016;
  });

  S.edges.forEach((e) => {
    const dx = e.t.x - e.s.x, dy = e.t.y - e.s.y;
    const d = Math.hypot(dx, dy) || 1;
    const rest = e.type === "derived-from" ? 95 : 70;
    const f = ((d - rest) / d) * 0.012;
    e.s.vx += dx * f; e.s.vy += dy * f;
    e.t.vx -= dx * f; e.t.vy -= dy * f;
  });

  S.nodes.forEach((n) => {
    n.x += (n.vx *= 0.82) * S.alpha;
    n.y += (n.vy *= 0.82) * S.alpha;
  });
  S.alpha *= 0.985;
}

// --- drawing ---------------------------------------------------------------
// The backdrop tracks pan/zoom at a fraction of the graph's rate, so the map
// reads as floating in front of it. Written only when it actually changed —
// touching `style.transform` every frame would thrash the compositor.
const skyEl = document.getElementById("sky");
let lastSky = "";
function parallax() {
  const t = `translate(${(S.view.x * 0.12).toFixed(1)}px, ${(S.view.y * 0.12).toFixed(1)}px) ` +
            `scale(${(1 + (S.view.k - 1) * 0.08).toFixed(3)})`;
  if (t !== lastSky) { lastSky = t; skyEl.style.transform = t; }
}

function nodeColor(n) {
  // A live selection recolours its own subgraph by rank, matching the chart;
  // everything else keeps its category colour.
  const ranked = S.rankColors && S.rankColors.get(n.id);
  if (ranked) return ranked;
  if (n.orphan && S.overlays.includes("orphans")) return ORPHAN_COLOR;
  return CAT_COLOR[n.cat] || ORPHAN_COLOR;
}

function focusSet() {
  // Hover lights up the node's 2-hop neighbourhood — the "what is this
  // connected to, and to what through that" question a node-link diagram
  // usually forces you to trace by eye.
  const anchor = S.hover || S.selected;
  if (!anchor) return null;
  const set = new Set([anchor]);
  (S.adj.get(anchor) || []).forEach((a) => {
    set.add(a);
    (S.adj.get(a) || []).forEach((b) => set.add(b));
  });
  return set;
}

function matches(n) {
  return S.query && n.label.toLowerCase().includes(S.query);
}

function draw() {
  const w = cv.clientWidth, h = cv.clientHeight;
  const dpr = window.devicePixelRatio || 1;
  if (cv.width !== w * dpr || cv.height !== h * dpr) {
    cv.width = w * dpr; cv.height = h * dpr;
  }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);  // transparent: the galaxy backdrop shows through
  parallax();

  ctx.save();
  ctx.translate(w / 2 + S.view.x, h / 2 + S.view.y);
  ctx.scale(S.view.k, S.view.k);

  const focus = focusSet();
  // Node positions are drawn exactly where the layout put them — no per-frame
  // drift. Selecting a node must never appear to move the map.

  // Edges
  S.edges.forEach((e) => {
    const lit = !focus || (focus.has(e.s.id) && focus.has(e.t.id));
    const x1 = e.s.x, y1 = e.s.y, x2 = e.t.x, y2 = e.t.y;
    ctx.globalAlpha = lit ? 0.62 : 0.05;
    ctx.strokeStyle = e.type === "derived-from" ? "#ff922b" : S.accent;
    ctx.lineWidth = (e.type === "derived-from" ? 0.5 : 0.9) / S.view.k;
    if (e.type === "derived-from") ctx.setLineDash([3 / S.view.k, 3 / S.view.k]);
    ctx.beginPath();
    ctx.moveTo(x1, y1);
    ctx.lineTo(x2, y2);
    ctx.stroke();
    ctx.setLineDash([]);

    // Synapse pulse travels along the edge; never under reduced motion.
    if (lit && !REDUCED_MOTION) {
      const p = (e.pulse + S.t * 0.004) % 1;
      ctx.globalAlpha = 0.75 * (1 - Math.abs(p * 2 - 1));
      ctx.fillStyle = S.accent;
      ctx.beginPath();
      ctx.arc(x1 + (x2 - x1) * p, y1 + (y2 - y1) * p, 1.4 / S.view.k, 0, 7);
      ctx.fill();
    }
  });

  // Nodes
  const showHubs = S.overlays.includes("hubs");
  const showBridges = S.overlays.includes("bridges");
  const showStale = S.overlays.includes("stale");
  const showLowConf = S.overlays.includes("confidence");

  S.nodes.forEach((n) => {
    const lit = !focus || focus.has(n.id);
    const hit = matches(n);
    const x = n.x, y = n.y;
    const color = nodeColor(n);
    let alpha = lit ? 1 : 0.12;
    if (S.query && !hit) alpha *= 0.25;
    if (showLowConf && n.confidence === "low") alpha *= 0.55;

    // Every dot glows, so the default view reads as fully lit; hubs and search
    // hits just bloom wider.
    const glow = (showHubs && n.hub ? 3.4 : 1) * (hit ? 3 : 1);
    const g = ctx.createRadialGradient(x, y, 0, x, y, n.r * 3.2 * glow);
    g.addColorStop(0, color);
    g.addColorStop(1, "rgba(0,0,0,0)");
    ctx.globalAlpha = alpha * 0.28;
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(x, y, n.r * 3.2 * glow, 0, 7);
    ctx.fill();

    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, n.r, 0, 7);
    ctx.fill();

    if (showBridges && n.bridgeHub) {
      ctx.globalAlpha = alpha * 0.9;
      ctx.strokeStyle = "#e8ecff";
      ctx.lineWidth = 1.2 / S.view.k;
      ctx.beginPath();
      ctx.arc(x, y, n.r + 3.5, 0, 7);
      ctx.stroke();
    }
    if (showStale && n.stale) {
      const beat = REDUCED_MOTION ? 0.8 : 0.5 + 0.5 * Math.sin(S.t * 0.05 + n.phase);
      ctx.globalAlpha = alpha * beat;
      ctx.strokeStyle = "#ffa421";
      ctx.lineWidth = 1.6 / S.view.k;
      ctx.beginPath();
      ctx.arc(x, y, n.r + 6, 0, 7);
      ctx.stroke();
    }
    if (n.id === S.selected) {
      ctx.globalAlpha = 1;
      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8 / S.view.k;
      ctx.beginPath();
      ctx.arc(x, y, n.r + 5, 0, 7);
      ctx.stroke();
    }

    // Labels stay readable rather than complete: hubs and whatever is in
    // focus / matched, and only once zoomed enough to have room. In the
    // single-metric modes the ranked panel carries the names instead.
    const named = hit || n.id === S.hover || n.id === S.selected ||
                  (lit && (n.hub || S.view.k > 1.5) && n.r > 5);
    if (named && lit) {
      ctx.globalAlpha = alpha;
      ctx.fillStyle = "#e8ecff";
      ctx.font = `${Math.max(9, 11 / S.view.k)}px -apple-system, "Segoe UI", sans-serif`;
      ctx.textAlign = "center";
      ctx.fillText(n.label.slice(0, 38), x, y - n.r - 5 / S.view.k);
    }
  });

  ctx.restore();
  ctx.globalAlpha = 1;
}

function frame() {
  S.t++;
  tick();
  draw();
  requestAnimationFrame(frame);
}

// --- interaction -----------------------------------------------------------
function toWorld(ev) {
  const rect = cv.getBoundingClientRect();
  return {
    x: (ev.clientX - rect.left - rect.width / 2 - S.view.x) / S.view.k,
    y: (ev.clientY - rect.top - rect.height / 2 - S.view.y) / S.view.k,
  };
}

function nodeAt(ev) {
  const p = toWorld(ev);
  let best = null, bestD = Infinity;
  S.nodes.forEach((n) => {
    const d = Math.hypot(n.x - p.x, n.y - p.y);
    if (d < Math.max(n.r + 6, 10) && d < bestD) { best = n; bestD = d; }
  });
  return best;
}

let dragging = false, moved = false, last = null;

cv.addEventListener("mousedown", (e) => {
  dragging = true; moved = false; last = { x: e.clientX, y: e.clientY };
  cv.classList.add("dragging");
});
window.addEventListener("mouseup", () => { dragging = false; cv.classList.remove("dragging"); });
cv.addEventListener("mousemove", (e) => {
  if (dragging) {
    const dx = e.clientX - last.x, dy = e.clientY - last.y;
    S.view.x += dx;
    S.view.y += dy;
    // A few pixels of jitter while clicking must not be read as a pan, or the
    // click would be swallowed and the node never open.
    if (Math.abs(dx) + Math.abs(dy) > 2) moved = true;
    last = { x: e.clientX, y: e.clientY };
    return;
  }
  const n = nodeAt(e);
  S.hover = n ? n.id : null;
  cv.style.cursor = n ? "pointer" : "grab";
});
cv.addEventListener("wheel", (e) => {
  e.preventDefault();
  const k = Math.min(4, Math.max(0.25, S.view.k * (e.deltaY < 0 ? 1.12 : 0.89)));
  S.view.k = k;
}, { passive: false });

// Single click selects: it lights the neighbourhood and fills the info panel,
// and stays entirely inside the canvas (no Streamlit rerun, so reading the
// graph never costs a round-trip).
cv.addEventListener("click", (e) => {
  if (moved) return;
  const n = nodeAt(e);
  if (!n) { S.selected = null; infoEl.style.display = "none"; renderRank(); return; }
  S.selected = n.id;
  showInfo(n);
  renderRank();  // the chart is scoped to the selection
});

// Double click opens the page. The navigation contract: hand the id to Python,
// which opens it in the existing reader. Deliberately NOT a window.top
// navigation — that is a full page load and would drop the Streamlit session
// (login + active DB).
cv.addEventListener("dblclick", (e) => {
  if (moved) return;
  const n = nodeAt(e);
  if (!n) return;
  S.selected = n.id;
  showInfo(n);
  renderRank();
  Streamlit.setValue({ node: n.id, kind: n.kind, n: ++S.clicks });
});

searchEl.addEventListener("input", () => { S.query = searchEl.value.trim().toLowerCase(); });

// --- panels ----------------------------------------------------------------
function showInfo(n) {
  const t = S.strings;
  const rows = [
    [t.type, n.cat],
    [t.links, String(n.deg)],
    [t.pagerank, n.pr.toFixed(4)],
    [t.bridge, n.bridge.toFixed(4)],
    [t.community, String(n.comm)],
  ];
  if (n.confidence) rows.push([t.confidence, n.confidence]);
  if (n.updated) rows.push([t.updated, n.updated + (n.stale ? " ⚠️" : "")]);
  infoEl.innerHTML =
    `<h2>${esc(n.label)}</h2>` +
    rows.map(([k, v]) => `<div class="kv"><span>${esc(k)}</span><b>${esc(v)}</b></div>`).join("") +
    (n.tags.length ? `<div class="tags">${n.tags.map(esc).join(" · ")}</div>` : "") +
    `<div class="hint">${esc(n.kind === "page" ? t.opened : t.sourceNode)}</div>`;
  infoEl.style.display = "block";
}

// --- ranked-circle chart ---------------------------------------------------
// The PageRank / Connections modes answer an ordering question ("which pages
// carry this wiki?") that a force layout cannot: circle area is the metric,
// the rank spectrum runs purple (top) → red (bottom). Scoped to the current
// selection's neighbourhood when there is one, otherwise the whole graph.
const RANK_TOP = 15;

function rankColor(f) {
  return `hsl(${Math.round(275 - 275 * f)}, 62%, 52%)`;
}

function renderRank() {
  const rankEl = document.getElementById("rank");
  if (!S.nodes.length) {
    rankEl.style.display = "none";
    S.rankColors = null;
    return;
  }
  const t = S.strings;
  const pr = S.sizeBy === "pagerank";
  const focus = S.selected ? focusSet() : null;
  const pool = focus ? S.nodes.filter((n) => focus.has(n.id)) : S.nodes;
  const val = (n) => (pr ? n.pr : n.deg);
  const ranked = pool.slice().sort((a, b) => val(b) - val(a) || a.label.localeCompare(b.label));
  const shown = ranked.slice(0, RANK_TOP);
  const max = val(shown[0]) || 1;
  // One scale for the chart and the canvas, so a selected subgraph's dots carry
  // the same violet→red rank colours as the rows. Spread across the *visible*
  // rows; anything ranked below them shares the tail colour.
  const scale = (i) => Math.min(i / Math.max(shown.length - 1, 1), 1);
  S.rankColors = focus
    ? new Map(ranked.map((n, i) => [n.id, rankColor(scale(i))]))
    : null;  // no selection => the map stays categorical

  rankEl.innerHTML =
    `<h3>${esc(pr ? t.rankPr : t.rankDeg)}</h3>` +
    `<div class="scope">${esc(focus ? t.rankSel : t.rankAll)} · ` +
    `${shown.length}/${ranked.length}</div>` +
    shown.map((n, i) => {
      const d = Math.max(9, Math.round(42 * Math.sqrt(val(n) / max)));
      const c = rankColor(scale(i));
      return `<div class="r" data-id="${esc(n.id)}" title="${esc(n.label)}">` +
        `<span class="n" style="color:${c}">${i + 1}</span>` +
        `<span class="c"><span style="width:${d}px;height:${d}px;background:${c}"></span></span>` +
        `<span class="name">${esc(n.label)}</span>` +
        `<span class="v">${pr ? val(n).toFixed(4) : val(n)}</span></div>`;
    }).join("");
  rankEl.style.display = "block";
}

// A row is the same handle as the dot: click selects, double click opens.
document.getElementById("rank").addEventListener("click", (e) => {
  const row = e.target.closest(".r");
  if (!row) return;
  const n = S.nodes.find((x) => x.id === row.dataset.id);
  if (!n) return;
  S.selected = n.id;
  showInfo(n);
  renderRank();
});
document.getElementById("rank").addEventListener("dblclick", (e) => {
  const row = e.target.closest(".r");
  const n = row && S.nodes.find((x) => x.id === row.dataset.id);
  if (n) Streamlit.setValue({ node: n.id, kind: n.kind, n: ++S.clicks });
});

function renderLegend(payload) {
  const t = S.strings;
  const cats = [...new Set(payload.nodes.map((n) => n.cat))].sort();
  legendEl.innerHTML =
    cats.map((c) =>
      `<div class="row"><span class="dot" style="background:${CAT_COLOR[c] || ORPHAN_COLOR}"></span>${esc(c)}</div>`
    ).join("") +
    `<div class="meta">${payload.nodes.length} ${esc(t.nodes)} · ` +
    `${payload.edges.length} ${esc(t.edges)} · ` +
    `${payload.communities} ${esc(t.clusters)}` +
    (payload.truncated ? ` · ${esc(t.truncated)}` : "") + `</div>`;
}

function esc(s) {
  return String(s).replace(/[&<>"]/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}

// --- render loop from Streamlit --------------------------------------------
function onRender(args) {
  const payload = args.graph;
  const sizeBy = args.sizeBy || "pagerank";
  const sizeChanged = sizeBy !== S.sizeBy;
  S.sizeBy = sizeBy;
  S.overlays = args.overlays || [];
  // Backdrop is decorative and env-controlled (GRAPH_BACKDROP); `none` leaves
  // the flat `--bg` the page already has behind the transparent canvas.
  const sky = args.backdrop !== "none";
  skyEl.style.display = sky ? "block" : "none";
  document.getElementById("veil").style.display = sky ? "block" : "none";
  S.strings = args.strings || {};
  S.accent = args.accent || "#4a9eff";
  document.documentElement.style.setProperty("--accent", S.accent);
  searchEl.placeholder = S.strings.search || "Search…";
  emptyEl.textContent = S.strings.empty || "";

  // Only rebuild the layout when the bundle actually changed; a rerun caused by
  // a click or an overlay toggle must not scatter the map the user is reading.
  const sig = payload.generated_at + "|" + payload.nodes.length + "|" + payload.edges.length;
  if (sig !== S.sig) {
    S.sig = sig;
    ingest(payload);
    renderLegend(payload);
  } else if (sizeChanged) {
    applySizes();  // radius only — positions are deliberately left alone
  }
  if (args.selected && args.selected !== S.selected) {
    S.selected = args.selected;
    const n = S.nodes.find((x) => x.id === args.selected);
    if (n) showInfo(n);
  }
  renderRank();
  Streamlit.setFrameHeight(args.height || 720);
}

window.addEventListener("message", (e) => {
  if (e.data && e.data.type === "streamlit:render") onRender(e.data.args || {});
});

Streamlit.ready();
Streamlit.setFrameHeight(720);
requestAnimationFrame(frame);
</script>
